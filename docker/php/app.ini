; Ajustes de PHP para producción (se suman a php.ini-production).

expose_php = Off
memory_limit = 256M
date.timezone = America/Bogota

; Documentos adjuntos a una solicitud: hasta 5 archivos de 10 MB (App\Support\QuotationAttachment).
upload_max_filesize = 10M
post_max_size = 60M
max_file_uploads = 20
; Subir 50 MB con una conexión lenta puede tardar más de los 60 s por defecto.
max_input_time = 300

; OPcache: el código va dentro de la imagen y solo cambia al reconstruirla,
; así que no hace falta revisar los archivos en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
