ServerName localhost
ServerTokens Prod
ServerSignature Off

# Cada proceso de Apache con PHP ocupa unos 30-60 MB. El límite evita que una
# avalancha de visitas agote la RAM del servidor. Se ajusta con APACHE_MAX_WORKERS
# en el .env (40 es adecuado para una máquina de 4 GB).
<IfModule mpm_prefork_module>
    StartServers            5
    MinSpareServers         5
    MaxSpareServers         10
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild  1000
</IfModule>
