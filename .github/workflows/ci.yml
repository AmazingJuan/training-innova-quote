name: CI

# Checks every pull request and every push. On development, the deployment
# branch is published only when every check passes (the server deploys from it).

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (Pint, Larastan, audit, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, pdo_mysql, zip, gd, intl, curl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Known vulnerabilities
        run: composer audit

      - name: Tests (SQLite)
        run: php artisan test

  php-mariadb:
    name: Tests on MariaDB (as in production)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_DATABASE: testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, zip, gd, intl, curl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (ESLint, Prettier, Vitest, TypeScript, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ziggy-js types are resolved from vendor/tightenco/ziggy.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          npm ci

      - name: Lint (ESLint)
        run: npm run lint:check

      - name: Format (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (TypeScript + Vite)
        run: npm run build

  publish:
    name: Publish deployment branch
    needs: [php, php-mariadb, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deployment-branch
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, zip, gd, intl, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm and build frontend
        run: |
          npm ci
          npm run build

      - name: Remove Vite dev hot file
        run: rm -f public/hot

      - name: Assemble deployment tree
        run: |
          set -euo pipefail
          DEPLOY_DIR=$(mktemp -d)
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

          # Core Laravel runtime
          cp -a app bootstrap config public routes vendor artisan composer.json composer.lock "$DEPLOY_DIR/"

          # Database
          mkdir -p "$DEPLOY_DIR/database"
          cp -a database/migrations database/seeders "$DEPLOY_DIR/database/"
          [ -f database/.gitignore ] && cp -a database/.gitignore "$DEPLOY_DIR/database/"

          # Views only
          mkdir -p "$DEPLOY_DIR/resources"
          cp -a resources/views "$DEPLOY_DIR/resources/"

          # Storage
          cp -a storage "$DEPLOY_DIR/"

          # Env example
          [ -f .env.example ] && cp -a .env.example "$DEPLOY_DIR/"
          cp -a .env.production.example "$DEPLOY_DIR/"

          cp -a Dockerfile.deployment "$DEPLOY_DIR/Dockerfile"
          [ -f docker-compose.yml ] && cp -a docker-compose.yml "$DEPLOY_DIR/"
          [ -d docker ] && cp -a docker "$DEPLOY_DIR/"
          cp -a deploy "$DEPLOY_DIR/"

          # Sanity check
          test -f public/build/manifest.json || (echo "missing build" && exit 1)
          test -f deploy/configurar-env.sh || (echo "missing deploy scripts" && exit 1)

      - name: Check that the production image builds
        run: docker build -q -t cotizaciones-app:ci "$DEPLOY_DIR"

      - name: Push orphan branch deployment
        env:
          TOKEN: ${{ secrets.DEPLOY_BRANCH_TOKEN != '' && secrets.DEPLOY_BRANCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git init -b deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: build from ${GITHUB_SHA:0:7}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment
